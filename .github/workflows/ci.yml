name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ident
          POSTGRES_PASSWORD: ident
          POSTGRES_DB: ident
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ident"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ident:ident@localhost:5432/ident
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run typecheck

      - run: npm run db:migrate -w apps/api

      # Rollback safety (session 22c). DEPLOYMENT.md's recovery procedure
      # is "redeploy the last good build", which only works if the previous
      # release's code still runs against the current schema — redeploying
      # does not roll back a migration. Checked here so a destructive
      # migration is caught at PR time rather than during an incident.
      - run: npm run check:migrations

      - run: npm run test

      - run: npm run build
